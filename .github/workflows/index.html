<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mina Score">
  <title>Mina Ping Pong Counter</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --p1-color: #238636;
      --p2-color: #1f6feb;
      --text-color: #f0f6fc;
      --accent-yellow: #d29922;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      background: var(--card-bg);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .preset-select {
      background: #21262d;
      color: var(--text-color);
      border: 1px solid #30363d;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .match-info {
      text-align: center;
      padding: 8px 0;
      background: #161b22;
      font-size: 0.9rem;
      color: #8b949e;
      border-bottom: 1px solid #30363d;
    }

    .scoreboard {
      display: flex;
      flex: 1;
      width: 100%;
    }

    .player-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 10px;
      position: relative;
      cursor: pointer;
      transition: background-color 0.1s ease;
    }

    .player-zone:active {
      filter: brightness(1.2);
    }

    .p1-zone { background: rgba(35, 134, 54, 0.15); border-right: 1px solid #30363d; }
    .p2-zone { background: rgba(31, 111, 235, 0.15); }

    .player-name {
      font-size: 1.3rem;
      font-weight: 600;
      color: #8b949e;
    }

    .score-display {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
    }

    .p1-zone .score-display { color: #3fb950; }
    .p2-zone .score-display { color: #58a6ff; }

    .serve-badge {
      font-size: 0.9rem;
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--accent-yellow);
      color: #000;
      font-weight: 700;
      visibility: hidden;
    }

    .serve-badge.active {
      visibility: visible;
    }

    .sets-won {
      font-size: 1rem;
      color: #8b949e;
    }

    .controls {
      background: var(--card-bg);
      padding: 12px 16px;
      display: flex;
      justify-content: space-around;
      gap: 10px;
      border-top: 1px solid #30363d;
    }

    .btn {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      background: #21262d;
      border: 1px solid #30363d;
    }

    .btn:active {
      background: #30363d;
    }

    .btn-danger {
      background: #da3633;
      border-color: #f85149;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13, 17, 23, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .win-card {
      text-align: center;
      padding: 30px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid #30363d;
      max-width: 80%;
    }

    .win-title {
      font-size: 2rem;
      color: var(--accent-yellow);
      margin-bottom: 10px;
    }

    .win-subtitle {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mina Score</h1>
    <select id="presetSelect" class="preset-select" onchange="changePreset()">
      <option value="11">Ping Pong (11 pts)</option>
      <option value="21">Classic (21 pts)</option>
      <option value="5">Short Game (5 pts)</option>
    </select>
  </header>

  <div class="match-info" id="statusText">First to 11 (Win by 2)</div>

  <div class="scoreboard">
    <div class="player-zone p1-zone" onclick="addPoint(1)">
      <div class="player-name">PLAYER 1</div>
      <div class="sets-won" id="sets1">Sets: 0</div>
      <div class="score-display" id="score1">0</div>
      <div class="serve-badge" id="serve1">🏓 SERVE</div>
    </div>

    <div class="player-zone p2-zone" onclick="addPoint(2)">
      <div class="player-name">PLAYER 2</div>
      <div class="sets-won" id="sets2">Sets: 0</div>
      <div class="score-display" id="score2">0</div>
      <div class="serve-badge" id="serve2">🏓 SERVE</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="undo()">↩ Undo</button>
    <button class="btn" onclick="resetGame()">🔄 Reset Set</button>
    <button class="btn btn-danger" onclick="resetAll()">💥 Reset All</button>
  </div>

  <div class="overlay" id="winOverlay">
    <div class="win-card">
      <div class="win-title">🎉 WINNER! 🎉</div>
      <div class="win-subtitle" id="winnerText">Player 1 wins the match!</div>
      <button class="btn" style="background: var(--p1-color);" onclick="closeOverlay()">Next Game</button>
    </div>
  </div>

  <script>
    let targetScore = 11;
    let serveInterval = 2;

    let p1 = 0, p2 = 0;
    let sets1 = 0, sets2 = 0;
    let history = [];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq = 600, duration = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function updateDisplay() {
      document.getElementById('score1').innerText = p1;
      document.getElementById('score2').innerText = p2;
      document.getElementById('sets1').innerText = `Sets: ${sets1}`;
      document.getElementById('sets2').innerText = `Sets: ${sets2}`;

      let totalPoints = p1 + p2;
      let isDeuce = (p1 >= targetScore - 1) && (p2 >= targetScore - 1);

      // Serve rotation: switches every 1 point in deuce, otherwise uses preset interval
      let currentInterval = isDeuce ? 1 : serveInterval;
      let isP1Serve = Math.floor(totalPoints / currentInterval) % 2 === 0;

      document.getElementById('serve1').classList.toggle('active', isP1Serve);
      document.getElementById('serve2').classList.toggle('active', !isP1Serve);

      let statusMsg = `First to ${targetScore} (Win by 2)`;
      if (isDeuce) statusMsg = "🔥 DEUCE! Switch serve every point";
      document.getElementById('statusText').innerText = statusMsg;
    }

    function addPoint(player) {
      history.push({ p1, p2, sets1, sets2 });

      if (player === 1) p1++;
      else p2++;

      if (navigator.vibrate) navigator.vibrate(40);
      playBeep(player === 1 ? 700 : 500);

      checkWinCondition(player);
      updateDisplay();
    }

    function checkWinCondition(lastScorer) {
      if ((p1 >= targetScore || p2 >= targetScore) && Math.abs(p1 - p2) >= 2) {
        let winner = p1 > p2 ? "Player 1" : "Player 2";
        if (p1 > p2) sets1++; else sets2++;

        document.getElementById('winnerText').innerText = `${winner} wins this game!`;
        document.getElementById('winOverlay').classList.add('show');

        playBeep(900, 0.3);
        if (window.confetti) {
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
      }
    }

    function undo() {
      if (history.length > 0) {
        let lastState = history.pop();
        p1 = lastState.p1;
        p2 = lastState.p2;
        sets1 = lastState.sets1;
        sets2 = lastState.sets2;
        updateDisplay();
      }
    }

    function closeOverlay() {
      document.getElementById('winOverlay').classList.remove('show');
      p1 = 0; p2 = 0;
      updateDisplay();
    }

    function resetGame() {
      p1 = 0; p2 = 0;
      updateDisplay();
    }

    function resetAll() {
      p1 = 0; p2 = 0;
      sets1 = 0; sets2 = 0;
      history = [];
      updateDisplay();
    }

    function changePreset() {
      let val = parseInt(document.getElementById('presetSelect').value);
      targetScore = val;
      serveInterval = (val === 21) ? 5 : 2;
      resetGame();
    }

    updateDisplay();
  </script>
</body>
</html>
